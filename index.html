<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bloom is a study and wellbeing companion for secondary school students, made by Project Budline, a student-led initiative.">
<meta name="theme-color" content="#F5EEE1">
<meta property="og:title" content="Bloom by Project Budline">
<meta property="og:description" content="Check in, plan in small steps, focus, keep kind habits and notice what went well.">
<meta property="og:image" content="favicon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body><title>Bloom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: an analog-journal masthead, then asymmetric 12-column editorial spreads; ruled dividers and paper tones instead of shadows. Single warm light look by design. */
:root{
  color-scheme:light;
  --paper:#F5EEE1; --paper-2:#EDE3D1; --paper-3:#E4D7C1; --sheet:#FBF7EE; --line:#DCCFB8; --line-2:#C2B193;
  --ink:#2A231E; --ink-2:#64584C; --ink-3:#8A7C6C;
  --terra:#B4532F; --terra-ink:#8B3B1F; --terra-soft:#F1D9CA;
  --mustard:#C8961E; --mustard-ink:#6F4F08; --mustard-soft:#F3E3B4;
  --sage:#7A9270; --sage-ink:#40573A; --sage-soft:#DDE4D1;
  --clay:#C49A82; --clay-soft:#ECDDD0;
  --rose:#CC6F7B; --rose-ink:#8E3A46; --rose-soft:#F6DCDD;
  --dusk:#7C7398; --dusk-ink:#524B6E; --dusk-soft:#E4DFEA;
  --sky:#6F95A6; --sky-ink:#3B5D6A; --sky-soft:#DAE4E5;
  --m1:#CBC2DB; --m2:#B8CCD3; --m3:#EAD69E; --m4:#C6D6B4; --m5:#9AB886; --face:#2A231E;
  --gm-sky:#E8ECDF; --gm-hill:#C9D6B7; --gm-ground:#A9BE97;
  --gd-sky:#ECE1DA; --gd-hill:#D9C8B4; --gd-ground:#BDA98C;
  --gs-sky:#DEE7E6; --gs-hill:#EBDDBE; --gs-ground:#D9C397;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:4px; --ease:cubic-bezier(.3,.7,.35,1.25);
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .15 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.08;text-wrap:balance;margin:0;font-variation-settings:"SOFT" 100,"WONK" 0;letter-spacing:-.015em}
h1{font-size:clamp(2.3rem,6vw,4.1rem);font-weight:350}
h1 em,h2 em,.display em{font-style:italic;font-variation-settings:"SOFT" 100,"WONK" 1;color:var(--terra)}
h2{font-size:clamp(1.45rem,2.6vw,1.9rem)}
h3{font-size:1.2rem;font-weight:500}
p{margin:0}
a{color:var(--terra-ink)}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--mustard-soft)}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;flex:none}
.mono{font-family:var(--font-mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.fine{font-size:.86rem;color:var(--ink-2)}
.serif{font-family:var(--font-display)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}

/* masthead */
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:var(--ink);color:var(--paper);border:0;padding:10px 14px}
.skip:focus{top:10px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:2px}
.brand svg{width:34px;height:34px}
.brand b{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:1.55rem;letter-spacing:-.02em;font-variation-settings:"SOFT" 100,"WONK" 1}
.tnav{display:none;gap:2px;margin-left:10px}
.tnav button{border:0;background:none;padding:8px 10px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:.93rem;position:relative}
.tnav button::after{content:"";position:absolute;left:10px;right:10px;bottom:3px;height:1.5px;background:var(--terra);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.tnav button:hover{color:var(--ink)}
.tnav button:hover::after{transform:scaleX(.5)}
.tnav button[aria-current="page"]{color:var(--ink)}
.tnav button[aria-current="page"]::after{transform:scaleX(1)}
.tnav .ic{display:none}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync{display:none;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.72rem;color:var(--ink-2);letter-spacing:.03em}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sage)}
.sync.err::before{background:var(--terra)}
.sync.busy::before{background:var(--mustard)}
@media (min-width:1100px){.sync{display:inline-flex}}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border:1px solid var(--line-2);background:var(--sheet);cursor:pointer;border-radius:50%;transition:transform .3s var(--ease),background .2s}
.icon-btn:hover{background:var(--paper-2);transform:rotate(25deg)}
.pill-timer{display:flex;align-items:center;gap:6px;border:1px solid var(--sage);background:var(--sage-soft);color:var(--sage-ink);font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:var(--font-mono);font-size:.8rem}
@media (min-width:1000px){.tnav{display:flex}}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(7,1fr);background:var(--sheet);border-top:1px solid var(--line-2);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:8px 0 7px;font-size:.66rem;font-weight:600;color:var(--ink-2);cursor:pointer;min-width:0;position:relative}
.bnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bnav button[aria-current="page"]{color:var(--terra-ink)}
.bnav button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--terra)}
@media (min-width:1000px){.bnav{display:none}}

main{padding-block:28px 120px;outline:none}
@media (min-width:1000px){main{padding-block:40px 70px}}
.view{display:flex;flex-direction:column;gap:42px}
.view>*{animation:settle .55s var(--ease) both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}
@keyframes settle{from{transform:translateY(8px)}to{transform:none}}

/* editorial grid */
.spread{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
.spread>*{min-width:0}
@media (min-width:900px){
  .spread{grid-template-columns:repeat(12,1fr);gap:28px 36px}
  .c7{grid-column:span 7}.c5{grid-column:span 5}.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:1/-1}
  .c4o1{grid-column:9/span 4}.c5o1{grid-column:8/span 5}.c6o1{grid-column:7/span 6}
}
.page-head{display:grid;gap:14px;grid-template-columns:1fr;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--line)}
@media (min-width:900px){.page-head{grid-template-columns:7fr 4fr;gap:36px}.page-head .aside{grid-column:2}}
.page-head .aside{color:var(--ink-2);max-width:42ch}
.page-head .mono{margin-bottom:10px}

/* surfaces */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-width:0}
.sheet.tint{background:var(--paper-2);border-color:var(--paper-3)}
.ruled{border-top:1px solid var(--line);padding-top:22px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:3px;border:1px solid var(--ink);background:var(--sheet);color:var(--ink);padding:10px 18px;font-weight:600;cursor:pointer;line-height:1.2;min-height:44px;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s}
.btn .ic{width:18px;height:18px}
.btn:hover{background:var(--paper-2);transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:none;box-shadow:none}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--terra-ink);box-shadow:2px 2px 0 var(--mustard)}
.btn.ghost{border-color:var(--line-2);background:transparent}
.btn.ghost:hover{box-shadow:2px 2px 0 var(--line-2)}
.btn.danger{border-color:var(--terra);color:var(--terra-ink);background:transparent}
.btn.danger[data-armed="1"]{background:var(--terra);color:var(--paper)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.link{background:none;border:0;padding:0;color:var(--terra-ink);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;cursor:pointer}
.link:hover{text-decoration-style:wavy}
.mini{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer;flex:none;border-radius:3px;transition:background .2s,color .2s}
.mini:hover{color:var(--ink);background:var(--paper-2)}
.mini:disabled{opacity:.35;cursor:not-allowed}
.mini .ic{width:16px;height:16px}
.mini[data-armed="1"]{background:var(--terra);color:var(--paper);border-color:var(--terra);width:auto;padding:0 10px;font-size:.8rem;font-weight:700}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);background:transparent;white-space:nowrap}
.tag.sample{border-color:var(--mustard);color:var(--mustard-ink);background:var(--mustard-soft)}
.tag.sage{border-color:var(--sage);color:var(--sage-ink);background:var(--sage-soft)}
.tag.terra{border-color:var(--terra);color:var(--terra-ink);background:var(--terra-soft)}
.tag.dusk{border-color:var(--dusk);color:var(--dusk-ink);background:var(--dusk-soft)}
.tag.sky{border-color:var(--sky);color:var(--sky-ink);background:var(--sky-soft)}
.tag.mustard{border-color:var(--mustard);color:var(--mustard-ink);background:var(--mustard-soft)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.legend{font-weight:600;font-size:.93rem}
.field small{color:var(--ink-2)}
.opt{font-weight:400;color:var(--ink-3)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select,textarea{width:100%;border:0;border-bottom:1.5px solid var(--line-2);background:transparent;border-radius:0;padding:10px 2px;min-height:44px;transition:border-color .25s}
textarea{border:1px solid var(--line-2);border-radius:var(--r);padding:12px;background:var(--sheet);resize:vertical;min-height:96px;line-height:1.55}
select{background:var(--sheet);border:1px solid var(--line-2);border-radius:var(--r);padding:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--terra)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--sheet);font-weight:500;font-size:.9rem;cursor:pointer;transition:transform .25s var(--ease),background .2s}
.chip:hover span{transform:translateY(-1px) rotate(-1deg);background:var(--paper-2)}
.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip input:checked+span::before{content:"✓";font-size:.8em}
.chip input:focus-visible+span{outline:2px solid var(--terra);outline-offset:2px}
.form-row{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.form-row.c2{grid-template-columns:1fr 1fr}}
.err{color:var(--terra-ink);font-weight:600;font-size:.9rem}
.ok-msg{background:var(--sage-soft);border-left:3px solid var(--sage);padding:10px 14px;font-size:.95rem}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--paper-3);border:1px solid var(--line-2);position:relative;flex:none;cursor:pointer;margin:2px 0 0;transition:background .25s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--sheet);border:1px solid var(--line-2);transition:transform .35s var(--ease)}
.switch input:checked{background:var(--sage)}
.switch input:checked::after{transform:translateX(18px)}
.switch b{display:block;font-weight:600}

/* tabs */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{border:0;background:none;padding:10px 0;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;position:relative;font-size:.95rem}
.tabs button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);transform:scaleX(0);transition:transform .35s var(--ease)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{transform:scaleX(1)}

/* banner */
.banner-in{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:10px;font-size:.9rem;border-bottom:1px dashed var(--mustard)}
.banner-in strong{font-family:var(--font-display);font-style:italic;font-weight:500;color:var(--mustard-ink);font-size:1.02rem}
.banner-in .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* home */
.hero h1{max-width:13ch}
.hero .lede{font-size:1.08rem;color:var(--ink-2);max-width:44ch;margin-top:18px}
.note-card{background:var(--sheet);border:1px solid var(--line);padding:18px 20px 20px;transform:rotate(-1.6deg);max-width:300px;position:relative;transition:transform .5s var(--ease)}
.note-card:hover{transform:rotate(0)}
.note-card::before{content:"";position:absolute;top:-9px;left:50%;width:64px;height:18px;transform:translateX(-50%) rotate(2deg);background:color-mix(in srgb,var(--mustard-soft) 85%,transparent);border:1px solid color-mix(in srgb,var(--mustard) 30%,transparent)}
.note-card p{font-family:var(--font-display);font-style:italic;font-size:1.25rem;line-height:1.3;font-variation-settings:"SOFT" 100,"WONK" 1}
.comp-big{width:120px;height:120px}
.blink .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.contents{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.contents li{border-bottom:1px solid var(--line)}
.contents button{display:grid;grid-template-columns:auto 1fr auto;gap:4px 18px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:16px 4px;cursor:pointer;transition:background .25s,padding .35s var(--ease)}
.contents button:hover{background:var(--paper-2);padding-left:12px}
.contents .k{grid-column:1;grid-row:1;font-family:var(--font-mono);font-size:.74rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;min-width:56px}
.contents b{grid-column:2;grid-row:1;font-family:var(--font-display);font-weight:400;font-size:1.4rem;line-height:1.15}
.contents small{grid-column:2;grid-row:2;color:var(--ink-2);font-size:.9rem}
.contents .arr{grid-column:3;grid-row:1/span 2;align-self:center;color:var(--terra);transition:transform .35s var(--ease)}
.contents button:hover .arr{transform:translateX(5px)}
.pull{font-family:var(--font-display);font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.18;font-weight:350}
.pull::before{content:"“";color:var(--terra)}
.pull::after{content:"”";color:var(--terra)}
.facts{list-style:none;margin:0;padding:0}
.facts li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px dotted var(--line-2)}
.facts .n{font-family:var(--font-display);font-size:1.5rem;min-width:30px;font-variant-numeric:tabular-nums}

/* habits */
.goal-box{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.goal-box input{flex:1 1 220px;font-family:var(--font-display);font-size:1.35rem;font-style:italic}
.goal-set{display:flex;gap:14px;align-items:flex-start}
.goal-set .gtext{font-family:var(--font-display);font-size:clamp(1.35rem,2.6vw,1.8rem);line-height:1.2;flex:1;min-width:0;overflow-wrap:anywhere}
.goal-set.done .gtext{text-decoration:line-through;text-decoration-color:var(--terra);text-decoration-thickness:2px}
.stampbox{appearance:none;-webkit-appearance:none;width:34px;height:34px;border:1.5px solid var(--ink);border-radius:50%;flex:none;cursor:pointer;display:grid;place-items:center;background:var(--sheet);margin:2px 0 0;transition:background .2s}
.stampbox:hover{background:var(--paper-2)}
.stampbox:checked{background:var(--terra);border-color:var(--terra)}
.stampbox:checked::after{content:"";width:12px;height:7px;border-left:2.5px solid var(--paper);border-bottom:2.5px solid var(--paper);transform:translateY(-2px) rotate(-45deg);animation:stamp .45s var(--ease)}
@keyframes stamp{from{transform:translateY(-2px) rotate(-45deg) scale(0)}to{transform:translateY(-2px) rotate(-45deg) scale(1)}}
.habits{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.habit{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.habit .hname{font-family:var(--font-display);font-size:1.25rem;line-height:1.2}
.habit.done .hname{color:var(--ink-2)}
.habit .hctrl{grid-column:2;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.habit .why{grid-column:2;font-size:.9rem;color:var(--ink-2);max-width:60ch}
.week-dots{display:inline-flex;gap:4px;align-items:center}
.week-dots i{width:9px;height:9px;border-radius:50%;border:1px solid var(--line-2)}
.week-dots i.on{background:var(--sage);border-color:var(--sage)}
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:26px;height:32px;border:1.5px solid var(--sky-ink);border-top:0;border-radius:0 0 6px 6px;background:transparent;cursor:pointer;position:relative;overflow:hidden;padding:0}
.glass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:var(--sky);transition:height .45s var(--ease)}
.glass.full::after{height:78%}
.glass:hover{background:var(--sky-soft)}
.grat{display:flex;flex-direction:column;gap:8px}
.grat label{display:flex;gap:10px;align-items:baseline}
.grat .num{font-family:var(--font-display);font-style:italic;color:var(--terra);font-size:1.2rem;width:18px}
.library{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.library{grid-template-columns:1fr 1fr}}
.lib-item{position:relative}
.lib-item input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.lib-item span{display:block;border:1px solid var(--line-2);padding:12px 14px 12px 40px;border-radius:var(--r);background:var(--sheet);cursor:pointer;height:100%;transition:background .2s,transform .3s var(--ease);position:relative}
.lib-item span::before{content:"";position:absolute;left:13px;top:15px;width:16px;height:16px;border:1.5px solid var(--ink-2);border-radius:3px}
.lib-item input:checked+span{background:var(--sage-soft);border-color:var(--sage)}
.lib-item input:checked+span::before{background:var(--sage-ink);border-color:var(--sage-ink);box-shadow:inset 0 0 0 3px var(--sage-soft)}
.lib-item:hover span{transform:translateY(-1px)}
.lib-item input:focus-visible+span{outline:2px solid var(--terra);outline-offset:2px}
.lib-item b{display:block;font-weight:600}
.lib-item small{color:var(--ink-2);font-size:.84rem;line-height:1.4;display:block;margin-top:2px}
.box-breath{position:relative;width:min(240px,70vw);aspect-ratio:1;margin:10px auto}
.box-breath svg{width:100%;height:100%}
.box-breath .frame{fill:none;stroke:var(--line-2);stroke-width:2}
.box-breath .dot{fill:var(--terra)}
.box-breath .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.box-breath .ph{font-family:var(--font-display);font-size:1.6rem;font-style:italic}
.box-breath .ct{font-family:var(--font-display);font-size:2.6rem;font-variant-numeric:tabular-nums;line-height:1}

/* mood */
.mood-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.mood-opt{position:relative;border-left:1px solid var(--line-2)}
.mood-opt:first-child{border-left:0}
.mood-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.mood-opt span{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 2px 10px;font-weight:600;font-size:.84rem;cursor:pointer;background:var(--sheet);transition:background .2s}
.mood-opt svg{width:40px;height:40px;transition:transform .4s var(--ease)}
.mood-opt:hover svg{transform:rotate(-8deg) scale(1.06)}
.mood-opt input:checked+span{background:var(--paper-3)}
.mood-opt input:checked+span svg{transform:scale(1.12)}
.mood-opt input:checked+span::after{content:"selected";font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--terra-ink)}
.mood-opt input:focus-visible+span{outline:2px solid var(--terra);outline-offset:-4px}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.strip .d{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font-mono);font-size:.64rem;color:var(--ink-2);min-width:34px}
.strip svg{width:28px;height:28px}
.strip .none{width:28px;height:28px;border-radius:50%;border:1px dashed var(--line-2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .wd{font-family:var(--font-mono);font-size:.66rem;text-align:center;color:var(--ink-2);padding:4px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-transform:uppercase}
.cal .c{aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;color:var(--ink-2);gap:1px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.cal .c svg{width:58%;height:58%;max-width:28px;max-height:28px}
.cal .c.today{background:var(--mustard-soft);color:var(--ink);font-weight:700}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.hist svg.face{width:34px;height:34px;flex:none}
.hist .body{flex:1;min-width:0}
.hist .note{margin-top:4px;overflow-wrap:anywhere;font-family:var(--font-display);font-style:italic;font-size:1.02rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.insights{display:grid;gap:0;grid-template-columns:1fr;border-top:1px solid var(--ink)}
@media (min-width:720px){.insights{grid-template-columns:1fr 1fr}.insights .insight:nth-child(odd){border-right:1px solid var(--line);padding-right:22px}.insights .insight:nth-child(even){padding-left:22px}}
.insight{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.insight .tic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid var(--sky);color:var(--sky-ink)}
.insight.pos .tic{border-color:var(--sage);color:var(--sage-ink)}
.insight.soft .tic{border-color:var(--dusk);color:var(--dusk-ink)}
.insight b{display:block;margin-bottom:2px;font-family:var(--font-display);font-weight:500;font-size:1.12rem;line-height:1.25}
.insight p{font-size:.93rem;color:var(--ink-2)}
.ai-sheet{background:var(--dusk-soft);border-color:color-mix(in srgb,var(--dusk) 40%,transparent)}
.support-note{display:flex;gap:12px;align-items:flex-start;background:var(--terra-soft);border-left:3px solid var(--terra);padding:14px 16px}
.support-note .ic{color:var(--terra-ink);margin-top:3px}

/* tasks */
.task{display:flex;flex-direction:column;gap:12px}
.task-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.task-title{font-family:var(--font-display);font-size:1.45rem;line-height:1.15;overflow-wrap:anywhere}
.bar{height:4px;background:var(--paper-3);overflow:hidden}
.bar span{display:block;height:100%;background:var(--sage-ink);transition:width .6s var(--ease)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dotted var(--line-2)}
.steps li.done input[type=text]{text-decoration:line-through;text-decoration-color:var(--terra);color:var(--ink-3)}
.steps input[type=checkbox]{width:20px;height:20px;accent-color:var(--terra);flex:none;cursor:pointer}
.steps input[type=text]{border:0;background:none;padding:6px 4px;min-height:36px;flex:1;min-width:0}
.steps input[type=text]:focus{background:var(--paper-2)}
.steps .ord{display:flex;gap:2px}
.steps .mini{border-color:transparent}
.add-step{display:flex;gap:8px;align-items:flex-end}
.add-step input{flex:1;min-width:0}
.week{display:grid;gap:0;grid-template-columns:1fr;border-top:1px solid var(--ink)}
@media (min-width:760px){.week{grid-template-columns:repeat(7,1fr)}.wday{border-right:1px solid var(--line)}.wday:last-child{border-right:0}}
.wday{padding:10px;min-height:110px;display:flex;flex-direction:column;gap:6px;min-width:0;border-bottom:1px solid var(--line)}
.wday.today{background:var(--mustard-soft)}
.wday h3{font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:500}
.wi{font-size:.84rem;padding:4px 8px;line-height:1.3;overflow-wrap:anywhere;border-left:2px solid}
.wi.act{border-color:var(--dusk);background:var(--dusk-soft)}
.wi.due{border-color:var(--terra);background:var(--terra-soft)}
.wi small{display:block;font-family:var(--font-mono);font-size:.66rem;opacity:.85}

/* focus */
.lens{display:flex;gap:0;border:1px solid var(--line-2);border-radius:var(--r);width:max-content;max-width:100%;overflow:hidden}
.lens button{border:0;border-left:1px solid var(--line-2);background:var(--sheet);padding:8px 14px;font-weight:600;cursor:pointer;font-family:var(--font-mono);font-size:.8rem}
.lens button:first-child{border-left:0}
.lens button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lens button:disabled{opacity:.5;cursor:not-allowed}
.ring{position:relative;width:min(270px,100%);aspect-ratio:1;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--paper-3)}
.ring .prog{stroke:var(--sage-ink);transition:stroke-dashoffset .3s linear}
.ring.break .prog{stroke:var(--sky-ink)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.ring .time{font-family:var(--font-display);font-size:3.4rem;font-weight:350;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.garden{width:100%;display:block;max-width:100%;border:1px solid var(--line)}
.g-meadow{--gsky:var(--gm-sky);--ghill:var(--gm-hill);--gground:var(--gm-ground)}
.g-dusk{--gsky:var(--gd-sky);--ghill:var(--gd-hill);--gground:var(--gd-ground)}
.g-seaside{--gsky:var(--gs-sky);--ghill:var(--gs-hill);--gground:var(--gs-ground)}
.gsky{fill:var(--gsky)} .ghill{fill:var(--ghill)} .gground{fill:var(--gground)}
.gstem{stroke:var(--sage-ink);stroke-width:2.5;stroke-linecap:round;fill:none}
.gleaf{fill:var(--sage)} .gleaf2{fill:var(--m5)} .gtrunk{fill:#8C6A4F}
.gp1{fill:var(--terra)} .gp2{fill:var(--dusk)} .gp3{fill:var(--mustard)} .gp4{fill:var(--clay)}
.gcap{fill:var(--terra)} .gspot{fill:var(--sheet)} .gmstem{fill:var(--sheet)}
.gsun{fill:var(--mustard);opacity:.55}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .9s var(--ease)}
@keyframes pop{from{transform:scale(0) rotate(-12deg)}to{transform:scale(1)}}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.break-panel{background:var(--sky-soft);border-color:color-mix(in srgb,var(--sky) 45%,transparent)}
.breathe{width:110px;height:110px;margin:8px auto;border-radius:50%;border:1.5px solid var(--sky-ink);background:radial-gradient(circle,var(--sky-soft) 0%,transparent 70%);animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%{transform:scale(.6)}40%{transform:scale(1)}60%{transform:scale(1)}100%{transform:scale(.6)}}

/* chat */
.chat{display:flex;flex-direction:column;gap:14px}
.chat-log{display:flex;flex-direction:column;gap:14px;max-height:min(60vh,560px);overflow-y:auto;padding:4px 2px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:92%}
.msg .av{width:30px;height:30px;flex:none}
.msg .b{padding:12px 16px;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r) var(--r) var(--r) 0;min-width:0;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.user .b{background:var(--ink);color:var(--paper);border-color:var(--ink);border-radius:var(--r) var(--r) 0 var(--r)}
.msg .who{font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-bottom:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg .b p+p,.msg .b p+ul,.msg .b ul+p,.msg .b p+ol,.msg .b ol+p{margin-top:8px}
.msg .b ul,.msg .b ol{margin:6px 0 0;padding-left:20px}
.msg .b ul.check{list-style:none;padding-left:2px}
.msg .b ul.check li{display:flex;gap:8px;align-items:flex-start;margin:3px 0}
.cb{width:14px;height:14px;border:1.5px solid var(--terra);border-radius:2px;flex:none;margin-top:5px}
.msg .b code{background:var(--paper-2);padding:1px 5px;font-size:.9em;font-family:var(--font-mono)}
.md-h{font-weight:700}
.msg.safety{max-width:100%}
.msg.safety .b{background:var(--terra-soft);border-color:var(--terra)}
.thinking{display:inline-flex;gap:4px;align-items:center;color:var(--ink-2)}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--ink-2);animation:dots 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
.chat-form{display:flex;gap:8px;align-items:flex-end}
.chat-form textarea{min-height:50px;max-height:160px;flex:1;min-width:0}
.starters{display:flex;gap:8px;flex-wrap:wrap}
.starter{border:1px dashed var(--line-2);background:none;border-radius:999px;padding:6px 13px;font-size:.88rem;cursor:pointer;color:var(--ink-2);text-align:left;transition:border-color .2s,color .2s,transform .3s var(--ease)}
.starter:hover{border-color:var(--terra);color:var(--terra-ink);transform:translateY(-1px)}
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:999px;border:1px solid}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.live{color:var(--sage-ink);border-color:var(--sage);background:var(--sage-soft)}
.status.demo{color:var(--mustard-ink);border-color:var(--mustard);background:var(--mustard-soft)}
.status.checking{color:var(--ink-2);border-color:var(--line-2)}

/* netwise */
.lesson{border-bottom:1px solid var(--line)}
.lesson-h{display:flex;width:100%;gap:16px;align-items:center;padding:18px 0;border:0;background:none;text-align:left;cursor:pointer;transition:padding .35s var(--ease)}
.lesson-h:hover{padding-left:8px}
.lesson-h .tic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid}
.lesson-h .t{flex:1;min-width:0}
.lesson-h .t b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.4rem;line-height:1.15}
.lesson-b{padding:0 0 22px;display:flex;flex-direction:column;gap:18px}
@media (min-width:900px){.lesson-b{padding-left:58px;max-width:820px}}
.scn{border-top:1px dotted var(--line-2);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.scn .story{font-family:var(--font-display);font-size:1.15rem;line-height:1.4}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:1px solid var(--line-2);background:var(--sheet);border-radius:var(--r);padding:11px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:transform .3s var(--ease),background .2s}
.choice:hover{transform:translateX(4px);background:var(--paper-2)}
.choice[aria-pressed="true"]{border-color:var(--ink);background:var(--paper-2)}
.choice .k{font-family:var(--font-display);font-style:italic;font-size:1.05rem;color:var(--terra);width:16px;flex:none}
.fb{padding:12px 16px;display:flex;flex-direction:column;gap:4px;border-left:3px solid}
.fb.ok2{background:var(--sage-soft);border-color:var(--sage)} .fb.ok1{background:var(--mustard-soft);border-color:var(--mustard)} .fb.ok0{background:var(--terra-soft);border-color:var(--terra)}
.fb b{font-family:var(--font-display);font-weight:500;font-size:1.05rem}

/* wins */
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:22px}
.timeline .day{font-family:var(--font-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);padding-bottom:6px;border-bottom:1px solid var(--ink)}
.win{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dotted var(--line-2)}
.win .body{flex:1;min-width:0;overflow-wrap:anywhere}
.win .body p{font-family:var(--font-display);font-size:1.15rem;line-height:1.35}

/* support */
.urgent{background:var(--terra-soft);border:1px solid var(--terra);border-radius:var(--r);padding:24px}
.ph{display:inline-block;border:1px dashed var(--ink-2);padding:0 6px;font-family:var(--font-mono);font-size:.82em}
.resource{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dotted var(--line-2)}

/* onboarding & loading */
.ob{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;padding-block:28px 40px}
.ob-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.ob-progress{height:2px;background:var(--paper-3);margin-top:-1px}
.ob-progress span{display:block;height:100%;background:var(--terra);transition:width .5s var(--ease)}
.ob-body{flex:1;display:grid;gap:30px;grid-template-columns:1fr;padding-top:36px;align-content:start}
@media (min-width:900px){.ob-body{grid-template-columns:5fr 6fr;gap:60px;padding-top:64px}}
.ob-body h1{font-size:clamp(2.2rem,5.4vw,3.8rem)}
.ob-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding-top:30px;border-top:1px solid var(--line);margin-top:30px}
.choice-card{position:relative}
.choice-card input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.choice-card span{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line-2);border-radius:var(--r);padding:18px;background:var(--sheet);cursor:pointer;transition:transform .3s var(--ease),background .2s;height:100%}
.choice-card:hover span{transform:translateY(-2px)}
.choice-card input:checked+span{border-color:var(--ink);background:var(--paper-2);box-shadow:3px 3px 0 var(--ink)}
.choice-card input:disabled+span{opacity:.55;cursor:not-allowed}
.choice-card input:focus-visible+span{outline:2px solid var(--terra);outline-offset:2px}
.choice-card b{font-family:var(--font-display);font-weight:500;font-size:1.25rem}
.opt-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:10px}
.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;display:block;background:#000;transition:transform .6s var(--ease)}
.brand:hover .logo{transform:rotate(-10deg)}
.brand .by{display:none;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-left:2px;align-self:flex-end;padding-bottom:6px}
@media (min-width:600px){.brand .by{display:inline}}
@media (min-width:1000px) and (max-width:1180px){.brand .by{display:none}}
.opt-cards .choice-card span{align-items:center;text-align:center;padding:12px 6px}
.opt-cards svg{width:48px;height:48px}
.loading{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.loading svg{width:90px;height:90px}

/* dialog, toasts, misc */
dialog{border:1px solid var(--line-2);border-radius:var(--r);padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 32px);background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(42,35,30,.4)}
.dlg-in{padding:24px;display:flex;flex-direction:column;gap:20px}
.dlg-sec{display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:1px solid var(--line)}
.dlg-foot{position:sticky;bottom:0;background:var(--paper);display:flex;gap:10px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;width:min(460px,calc(100vw - 32px))}
@media (min-width:1000px){.toasts{bottom:26px}}
.toast{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;animation:rise .45s var(--ease)}
.toast button{margin-left:auto;background:none;border:1px solid color-mix(in srgb,var(--paper) 40%,transparent);color:var(--paper);border-radius:3px;padding:4px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
@keyframes rise{from{transform:translateY(12px) rotate(-1deg)}to{transform:none}}
.foot{padding-block:22px 110px;font-size:.84rem;color:var(--ink-2);border-top:1px solid var(--line)}
@media (min-width:1000px){.foot{padding-block:22px 40px}}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:20px 0;color:var(--ink-2)}
.empty b{font-family:var(--font-display);font-weight:400;font-size:1.3rem;color:var(--ink)}
.empty svg{width:52px;height:52px}
details>summary{cursor:pointer;font-weight:600;list-style:none}
details>summary::before{content:"+ ";color:var(--terra)}
details[open]>summary::before{content:"− "}
body.ob-mode .top,body.ob-mode .bnav,body.ob-mode .foot,body.ob-mode #banner{display:none}
/* per-page colour */
body{--accent:var(--terra);--accent-ink:var(--terra-ink);--accent-soft:var(--terra-soft);--accent-display:#B4532F}
body[data-view="mood"]{--accent:var(--dusk);--accent-ink:var(--dusk-ink);--accent-soft:var(--dusk-soft);--accent-display:#6A6190}
body[data-view="habits"]{--accent:var(--sage);--accent-ink:var(--sage-ink);--accent-soft:var(--sage-soft);--accent-display:#58764D}
body[data-view="plan"]{--accent:var(--sky);--accent-ink:var(--sky-ink);--accent-soft:var(--sky-soft);--accent-display:#467588}
body[data-view="learn"]{--accent:var(--mustard);--accent-ink:var(--mustard-ink);--accent-soft:var(--mustard-soft);--accent-display:#9C700A}
body[data-view="support"]{--accent:var(--rose);--accent-ink:var(--rose-ink);--accent-soft:var(--rose-soft);--accent-display:#A9505C}
body[data-view="studio"]{--accent:var(--rose);--accent-ink:var(--rose-ink);--accent-soft:var(--mustard-soft);--accent-display:#A9505C}
h1 em,h2 em,.display em{color:var(--accent-display)}
.page-head{position:relative;isolation:isolate}
.page-head::before{content:"";position:absolute;right:2%;top:-24px;width:min(280px,46vw);height:160px;background:var(--accent-soft);border-radius:58% 42% 50% 50%/45% 55% 45% 55%;z-index:-1;animation:morph 18s ease-in-out infinite}
.page-head::after{content:"";position:absolute;right:1%;top:-34px;width:40px;height:40px;background:var(--accent);opacity:.55;border-radius:50% 50% 50% 0;z-index:-1;animation:morph 11s ease-in-out infinite reverse}
@keyframes morph{0%,100%{border-radius:58% 42% 50% 50%/45% 55% 45% 55%;transform:rotate(0)}50%{border-radius:40% 60% 38% 62%/58% 42% 58% 42%;transform:rotate(9deg) scale(1.04)}}
.tabs button::after,.tnav button::after{background:var(--accent)}
.bnav button[aria-current="page"]{color:var(--accent-ink)}
.bnav button[aria-current="page"]::before{background:var(--accent)}
.sheet.tint{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.contents .k{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.66rem;min-width:0;justify-self:start;align-self:center}
.pill-dusk{background:var(--dusk-soft);color:var(--dusk-ink)}.pill-sky{background:var(--sky-soft);color:var(--sky-ink)}.pill-sage{background:var(--sage-soft);color:var(--sage-ink)}
.pill-mustard{background:var(--mustard-soft);color:var(--mustard-ink)}.pill-terra{background:var(--terra-soft);color:var(--terra-ink)}.pill-rose{background:var(--rose-soft);color:var(--rose-ink)}
.contents li:nth-child(1) button:hover{background:var(--dusk-soft)}.contents li:nth-child(2) button:hover{background:var(--sky-soft)}.contents li:nth-child(3) button:hover{background:var(--sage-soft)}
.contents li:nth-child(4) button:hover{background:var(--mustard-soft)}.contents li:nth-child(5) button:hover{background:var(--terra-soft)}.contents li:nth-child(6) button:hover{background:var(--rose-soft)}

/* petals & avatar */
.petal-ic{width:16px;height:16px;flex:none}
.petal-ic.lg{width:30px;height:30px}
.me-chip{position:relative;display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--sheet);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.me-chip:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--rose)}
.me-chip b{font-family:var(--font-display);font-weight:500;font-size:1.05rem;font-variant-numeric:tabular-nums}
.me-av{width:34px;height:34px;border-radius:50%;overflow:hidden;border:1px solid var(--line-2);display:block}
.me-av svg{width:100%;height:auto;display:block}
.petal-pop{position:absolute;right:6px;top:-6px;font-family:var(--font-display);font-style:italic;font-weight:600;color:var(--rose-ink);background:var(--rose-soft);border:1px solid var(--rose);border-radius:999px;padding:0 8px;font-size:.85rem;pointer-events:none;animation:floatUp 1.3s var(--ease) forwards}
@keyframes floatUp{0%{transform:translateY(6px) scale(.6);opacity:0}25%{transform:translateY(-6px) scale(1.08) rotate(-4deg);opacity:1}100%{transform:translateY(-26px) rotate(4deg);opacity:0}}
.av-wrap{position:relative;width:min(230px,100%)}
.av-wrap.lg{width:min(320px,100%);margin:0 auto}
.av-frame{aspect-ratio:1;border-radius:50%;overflow:hidden;border:1.5px solid var(--ink);background:var(--paper-2);box-shadow:6px 6px 0 var(--accent-soft)}
.av-frame svg{width:100%;height:auto;display:block;margin-top:2%}
.comp-buddy{position:absolute;right:-10px;bottom:-8px;width:34%;transform:rotate(6deg)}
.comp-buddy svg{width:100%;height:auto;display:block}
.petal-card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.big-n{font-family:var(--font-display);font-size:2.8rem;line-height:1;display:flex;gap:8px;align-items:center;font-weight:400;font-variant-numeric:tabular-nums}
.lvl{font-size:1.7rem;font-style:italic;color:var(--rose-ink);line-height:1.1}
.lvlbar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:14px 0 10px}
.lvlbar span{height:10px;border-radius:999px;background:var(--paper-3);overflow:hidden;display:block}
.lvlbar i{display:block;height:100%;border-radius:999px;transition:width .9s var(--ease)}
.ward{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.ward.compact{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.ward-item{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:1px solid var(--line-2);background:var(--sheet);border-radius:var(--r);padding:8px 8px 10px;cursor:pointer;text-align:left;transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .2s;min-width:0}
.ward-item:hover{transform:translateY(-3px) rotate(-.8deg);box-shadow:3px 3px 0 var(--accent)}
.ward-item[aria-pressed="true"]{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);background:var(--paper-2)}
.ward-item[aria-disabled="true"]{cursor:not-allowed}
.ward-item[data-armed="1"]{background:var(--rose);color:var(--sheet);border-color:var(--rose);font-weight:700;justify-content:center;align-items:center;min-height:120px}
.ward-item .thumb{width:100%;aspect-ratio:1;overflow:hidden;border-radius:2px;background:var(--paper-2);display:grid;place-items:center}
.ward-item .thumb svg{width:100%;height:auto;display:block;margin-top:4%}
.ward-item.locked .thumb{filter:saturate(.45) opacity(.7)}
.ward-item b{font-weight:600;font-size:.88rem;line-height:1.25}
.ward.compact .ward-item b{font-size:.78rem}
.ward.compact .ward-item .tag{display:none}
.swatch-big{width:62%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(42,35,30,.2);display:block}
.price{display:inline-flex;gap:4px;align-items:center;font-family:var(--font-mono);font-size:.72rem;color:var(--rose-ink);white-space:nowrap}
.price.spend{color:var(--ink-2)}
.earn{list-style:none;margin:0;padding:0}
.earn li{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--line-2);font-size:.92rem}
.earn .price{min-width:52px}
.jar{background:linear-gradient(115deg,var(--rose-soft),var(--mustard-soft) 55%,var(--sage-soft));border:1px solid var(--line);border-radius:var(--r);padding:26px;position:relative;overflow:hidden}
.jar::after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--rose) 50%,transparent);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.jar-num{display:flex;flex-direction:column;gap:2px}
.jar-num .n{font-family:var(--font-display);font-size:clamp(3rem,7vw,4.6rem);line-height:1;font-weight:350;color:var(--rose-ink);font-variant-numeric:tabular-nums}
@media (max-width:560px){.top-right{gap:6px}.me-chip{padding-right:9px}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .breathe{transform:scale(.85)}
}
</style>

function award(key,amt,why){
  const P=state.petals;if(!P||P.keys[key])return 0;
  const before=level(P.life).i;P.keys[key]=todayK();P.bal+=amt;P.life+=amt;P.log.unshift({d:new Date().toISOString(),amt,why});P.log=P.log.slice(0,30);
  petalPop(amt);paintPetals();save();
  const after=level(P.life);
  if(after.i>before)setTimeout(()=>toast(`You reached ${after.name}! Have a look in your studio.`,{label:'Open',fn:()=>go('studio')}),700);
  return amt;
}

function makeHostedSample(){

    const {data}=await SB.auth.getSession();const tok=data&&data.session&&data.session.access_token;

    catch(e){throw {code:e&&e.name==='AbortError'?'cancelled':'upstream_error'}}
    const j=await res.json().catch(()=>({}));
    if(!res.ok)throw {code:j.code||(res.status===429?'rate_limited':res.status===401?'not_signed_in':'upstream_error'),userMsg:j.error};
    return j;
  };
  const f=async(input,opts={})=>{const j=await call(input,opts);if(opts.onText)opts.onText({text:j.text,delta:j.text});return {text:j.text,truncated:!!j.truncated}};
  f.json=async(input,opts={})=>{const j=await call(input,opts,'json');const t=j.text||'';const m=t.match(/[\[{][\s\S]*[\]}]/);try{return JSON.parse(m?m[0]:t)}catch(e){throw {code:'invalid_json',text:t}}};

function statusPill(){
  if(aiStatus==='live') return `<span class="status live" title="Replies come from Claude, an AI model">Live AI</span>`;
  if(aiStatus==='checking') return `<span class="status checking">Checking AI…</span>`;
  return `<span class="status demo" title="${esc(aiNote)}">Demo replies · AI not connected</span>`;
}
function paintAIStatus(){document.querySelectorAll('[data-ai-status]').forEach(el=>el.innerHTML=statusPill()+(aiStatus==='demo'&&aiNote?` <span class="fine">${esc(aiNote)}</span>`:''))}
function aiFail(e){
  const c=e&&e.code;
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){aiStatus='demo';aiNote=c==='not_granted'?'You didn’t allow AI for this page, so helpers show demo replies.':'AI isn’t available for this account, so helpers show demo replies.';paintAIStatus();return 'switch'}
  if(c==='not_signed_in'){aiStatus='demo';aiNote='Sign in to your Bloom account to use the live AI helpers.';paintAIStatus();return 'switch'}
  if(c==='not_configured'){aiStatus='demo';aiNote='The AI helpers aren’t set up on this site yet, so they show example replies.';paintAIStatus();return 'switch'}
  if(e&&e.userMsg&&c!=='cancelled') return e.userMsg;
  if(c==='rate_limited') return 'The AI is busy or you’ve reached a usage limit. Try again in a little while.';
  if(c==='refused') return 'The AI couldn’t answer that one. Try asking in a different way.';
  if(c==='session_expired') return 'Your claude.ai session expired. Sign in again to keep using AI.';
  if(c==='cancelled') return '';
  return 'Something interrupted the connection. Try sending again.';
}

  let out='',list=null;
  const open=t=>{if(list!==t){close();out+=t==='check'?'<ul class="check">':`<${t}>`;list=t}};
  const close=()=>{if(list){out+=list==='check'?'</ul>':`</${list}>`;list=null}};
  for(const l of esc(src).split('\n')){
    let m;
    if((m=l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)/))){open('check');out+=`<li><span class="cb" aria-hidden="true"></span><span>${inline(m[2])}</span></li>`}
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){open('ul');out+=`<li>${inline(m[1])}</li>`}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){open('ol');out+=`<li>${inline(m[1])}</li>`}
    else{close();if((m=l.match(/^#{1,4}\s+(.*)/)))out+=`<p class="md-h">${inline(m[1])}</p>`;else if(l.trim())out+=`<p>${inline(l)}</p>`}
  }
  close();return out;
}

 [/revis|test|exam|quiz|mock|study for/i,['List the topics that will come up','Pick the topic you feel least sure about','Make a one-page summary','Try 5 practice questions','Take a short break','Check answers and note one thing to revisit']],
 [/lab|practical|experiment/i,['Re-read the method and aim','Set up your results table','Write up the method in your own words','Process the data or draw the graph','Take a short break','Write the conclusion and one evaluation point']],
 [/present|slides|speech|talk|poster/i,['Write the one main message in a sentence','List 3–5 points to cover','Make rough slides or notes','Take a short break','Practise it out loud once','Tidy up the visuals']],
 [/read|chapter|novel|book|article/i,['Skim headings or the first page','Read the first section','Write 3 bullet notes','Take a short break','Read the next section','Note one question to bring to class']],
 [/problem|worksheet|questions|maths|math|exercise|homework/i,['Look through all the questions first','Do the ones you feel okay about','Take a short break','Try the trickier ones with your notes','Mark answers and circle any to ask about']]];
const DEFAULT_STEPS=['Write down what “done” looks like','Gather what you need','Do the first 15 minutes','Take a short break','Keep going with the next part','Check it over'];
function localBreakdown(title,effort){
  const t=TEMPLATES.find(([re])=>re.test(title));let steps=(t?t[1]:DEFAULT_STEPS).slice();
  const n=effort==='small'?3:effort==='medium'?5:7;
  if(steps.length>n){steps=steps.filter(s=>!/break/i.test(s)||n>=5).slice(0,n)}
  return steps;
}

/* ---------- timer ---------- */
const T={mode:'idle',kind:'focus',total:0,remaining:0,endAt:0,ref:'',lastRef:'',int:null,prompt:STRETCHES[0]};
const curLen=()=>state.ui.focusLen||state.settings.focusLen||25;
function timerIdle(){T.mode='idle';T.kind='focus';T.total=T.remaining=curLen()*60}
function tick(){if(T.mode!=='running')return;T.remaining=Math.max(0,(T.endAt-Date.now())/1000);if(T.remaining<=0)finishTimer();else paintTimer()}
function startTimer(kind,mins){T.kind=kind;T.total=mins*60;T.remaining=T.total;T.endAt=Date.now()+T.total*1000;T.mode='running';if(!T.int)T.int=setInterval(tick,250);refreshFocus()}
function finishTimer(){
  if(T.kind==='focus'){
    const ref=T.ref;state.focusLog.push({id:uid(),date:new Date().toISOString(),mins:Math.round(T.total/60),ref});
    const g={id:uid(),kind:'sprout',date:new Date().toISOString()};state.garden.push(g);state.ui.newG=g.id;
    award('focus:'+g.id,10,'Focus session');T.mode='done';T.lastRef=ref;T.prompt=STRETCHES[Math.floor(Math.random()*STRETCHES.length)];save();
    toast('Session complete. A new sprout joined your garden.',view==='plan'&&state.ui.planTab==='focus'?null:{label:'See it',fn:()=>go('plan',{tab:'focus'})});
  }else{
    const g={id:uid(),kind:'flower',date:new Date().toISOString()};state.garden.push(g);state.ui.newG=g.id;save();
    award('break:'+g.id,3,'Took a break');timerIdle();toast('Break done. A flower bloomed in your garden.');
  }
  refreshFocus();
}
function paintTimer(){
  const tt=$('#timer-time'),pr=$('#timer-prog');
  const r=Math.ceil(T.remaining),txt=`${pad(Math.floor(r/60))}:${pad(r%60)}`;
  if(tt)tt.textContent=txt;
  if(pr){const C=2*Math.PI*110;pr.style.strokeDashoffset=String(C*(1-(T.total?T.remaining/T.total:1)))}
  const slot=$('#pill-slot');
  if(T.mode==='running'||T.mode==='paused'){
    const lbl=`${T.kind==='break'?'Break':'Focus'} ${txt}${T.mode==='paused'?' · paused':''}`;
    if(!$('#pill'))slot.innerHTML=`<button class="pill-timer" id="pill" data-go="plan" data-tab="focus">${ic('leaf')}<span></span></button>`;
    $('#pill span').textContent=lbl;$('#pill').setAttribute('aria-label',`${lbl}. Open FocusForest`);
  }else slot.innerHTML='';
}

const BR={int:null,start:0,rounds:4,phase:-1};
const BR_PH=['Breathe in','Hold','Breathe out','Hold'];
function openBreathing(){

  dlg.innerHTML=`<div class="dlg-in"><div class="row" style="justify-content:space-between"><div><p class="mono">Two-minute habit</p><h2 id="dlg-title">Box <em>breathing</em></h2></div><button type="button" class="mini" data-act="br-close" aria-label="Close">${ic('x')}</button></div>
   <p class="muted">Follow the dot around the square: in for 4, hold for 4, out for 4, hold for 4. Four rounds takes about a minute. Stop whenever you like.</p>
   <div class="box-breath"><svg viewBox="0 0 200 200" aria-hidden="true"><rect x="20" y="20" width="160" height="160" class="frame"/><circle id="br-dot" cx="20" cy="180" r="9" class="dot"/></svg>
     <div class="mid"><div class="ph" id="br-ph" aria-live="polite">Ready?</div><div class="ct" id="br-ct"></div><div class="fine" id="br-round"></div></div></div>

function brStart(){
  BR.start=Date.now();BR.phase=-1;clearInterval(BR.int);
  const btn=$('#br-btn');if(btn){btn.dataset.act='br-stop';btn.className='btn ghost';btn.innerHTML=`${ic('stop')} Stop`}
  BR.int=setInterval(()=>{
    const t=(Date.now()-BR.start)/1000,total=16*BR.rounds;
    if(t>=total){brDone();return}
    const cyc=t%16,ph=Math.floor(cyc/4),within=cyc%4,p=cyc/16;
    const dot=$('#br-dot');if(!dot){clearInterval(BR.int);return}
    const side=Math.floor(p*4),fr=(p*4)%1;let x,y;
    if(side===0){x=20;y=180-160*fr}else if(side===1){x=20+160*fr;y=20}else if(side===2){x=180;y=20+160*fr}else{x=180-160*fr;y=180}
    dot.setAttribute('cx',x.toFixed(1));dot.setAttribute('cy',y.toFixed(1));
    if(ph!==BR.phase){BR.phase=ph;$('#br-ph').textContent=BR_PH[ph]}
    $('#br-ct').textContent=String(4-Math.floor(within));$('#br-round').textContent=`Round ${Math.floor(t/16)+1} of ${BR.rounds}`;
  },50);
}
function brStop(){clearInterval(BR.int);BR.int=null}
function brDone(){
  brStop();const k=todayK();const l=state.habits.log[k]=state.habits.log[k]||{};l.breathe=1;award('breathe:'+k,3,'Box breathing');save();

const SPOTS=(()=>{const a=[];const rows=[[200,8],[225,9],[250,10]];rows.forEach(([y,n],ri)=>{for(let i=0;i<n;i++){a.push([40+i*(560/(n-1))+(ri%2?18:0)-(ri===2?10:0),y+((i*7)%9)])}});
  return a.sort((p,q)=>((p[0]*13+p[1]*7)%17)-((q[0]*13+q[1]*7)%17))})();
function gardenSVG(){
  const items=state.garden.slice(-SPOTS.length);
  const sprouts=state.garden.filter(g=>g.kind==='sprout').length;
  const stage=Math.min(4,Math.floor(sprouts/3));
  const theme=state.settings.gardenTheme||'meadow';
  const tree=stage===0?`<g transform="translate(320 196)"><path d="M0 0v-14" class="gstem"/><ellipse cx="-7" cy="-16" rx="8" ry="4" class="gleaf" transform="rotate(-25 -7 -16)"/><ellipse cx="7" cy="-18" rx="8" ry="4" class="gleaf2" transform="rotate(25 7 -18)"/></g>`
   :`<g transform="translate(320 200)"><rect x="-${3+stage*1.5}" y="-${30+stage*18}" width="${6+stage*3}" height="${30+stage*18}" rx="3" class="gtrunk"/>${Array.from({length:2+stage},(_,i)=>{const ang=(i/(1+stage))*Math.PI;const rx=Math.cos(ang)*(14+stage*9),ry=-(36+stage*18)-Math.sin(ang)*(8+stage*5);return `<circle cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="${12+stage*5}" class="${i%2?'gleaf2':'gleaf'}"/>`}).join('')}<circle cx="0" cy="-${44+stage*22}" r="${13+stage*5}" class="gleaf"/></g>`;
  const draw=(g,i)=>{const [x,y]=SPOTS[i];const cls=g.id===state.ui.newG?'pop':'';
    if(g.kind==='flower'){const p=['gp1','gp2','gp3','gp4'][i%4];return `<g class="${cls}" transform="translate(${x} ${y})"><path d="M0 0v-20" class="gstem"/><ellipse cx="5" cy="-8" rx="5" ry="2.5" class="gleaf" transform="rotate(-30 5 -8)"/>${[0,72,144,216,288].map(a=>`<circle cx="${(Math.cos(a*Math.PI/180)*6).toFixed(1)}" cy="${(-24+Math.sin(a*Math.PI/180)*6).toFixed(1)}" r="4.6" class="${p}"/>`).join('')}<circle cx="0" cy="-24" r="3.4" style="fill:var(--sheet)"/></g>`}
    if(g.kind==='mushroom')return `<g class="${cls}" transform="translate(${x} ${y})"><rect x="-3.5" y="-12" width="7" height="12" rx="3" class="gmstem"/><path d="M-12 -11a12 10 0 0 1 24 0z" class="gcap"/><circle cx="-4" cy="-16" r="2" class="gspot"/><circle cx="4" cy="-14" r="1.6" class="gspot"/></g>`;
    return `<g class="${cls}" transform="translate(${x} ${y})"><path d="M0 0v-14" class="gstem"/><ellipse cx="-6" cy="-14" rx="7" ry="3.4" class="gleaf" transform="rotate(-28 -6 -14)"/><ellipse cx="6" cy="-16" rx="7" ry="3.4" class="gleaf2" transform="rotate(28 6 -16)"/></g>`};
  const c=k=>state.garden.filter(g=>g.kind===k).length;
  return `<svg class="garden g-${theme}" viewBox="0 0 640 280" role="img" aria-label="Garden with ${c('sprout')} sprouts, ${c('flower')} flowers and ${c('mushroom')} mushrooms. The centre tree is at growth stage ${stage+1} of 5.">
   <rect width="640" height="280" class="gsky"/><circle cx="560" cy="58" r="26" class="gsun"/>
   <path d="M0 170 Q160 120 320 160 T640 150 V280 H0z" class="ghill"/>
   <path d="M0 192 Q200 172 400 188 T640 186 V280 H0z" class="gground"/>
   ${tree}${items.map(draw).join('')}</svg>`;
}

function analyze(){
  const now=Date.now(), es=state.moods.filter(e=>e.mood&&now-new Date(e.date)<=30*864e5);
  if(es.length<5)return {enough:false,n:es.length,items:[]};
  const items=[];const age=e=>(now-new Date(e.date))/864e5;
  const l7=es.filter(e=>age(e)<=7).map(e=>e.mood), p7=es.filter(e=>age(e)>7&&age(e)<=14).map(e=>e.mood);
  if(l7.length>=2&&p7.length>=2){const d=avg(l7)-avg(p7);
    if(d>=.4)items.push({cls:'pos',icon:'trendUp',title:'A bit brighter lately',detail:`This week your check-ins averaged ${f1(avg(l7))} out of 5, up from ${f1(avg(p7))} the week before.`});
    else if(d<=-.4)items.push({cls:'soft',icon:'trendDown',title:'This week has felt heavier',detail:`Check-ins averaged ${f1(avg(l7))} out of 5, down from ${f1(avg(p7))}. Worth noticing gently. Extra rest or a chat with someone you trust can help.`});
    else items.push({cls:'',icon:'steady',title:'Fairly steady',detail:`This week (${f1(avg(l7))}/5) looks similar to last week (${f1(avg(p7))}/5).`})}
  const st=TAGS.map(t=>{const w=es.filter(e=>(e.tags||[]).includes(t.id)).map(e=>e.mood),wo=es.filter(e=>!(e.tags||[]).includes(t.id)).map(e=>e.mood);return {t,n:w.length,aw:avg(w),awo:avg(wo),d:(w.length>=3&&wo.length>=2)?avg(w)-avg(wo):0}});
  st.filter(s=>s.d>=.5).sort((a,b)=>b.d-a.d).slice(0,2).forEach(s=>items.push({cls:'pos',icon:'leaf',title:`Brighter on “${s.t.label.toLowerCase()}” days`,detail:`When you tagged this (${s.n} times), check-ins averaged ${f1(s.aw)}/5, compared with ${f1(s.awo)}/5 otherwise. Might be worth making room for.`}));
  st.filter(s=>s.d<=-.5).sort((a,b)=>a.d-b.d).slice(0,1).forEach(s=>items.push({cls:'soft',icon:'wind',title:`“${s.t.label}” days have felt tougher`,detail:`Those check-ins averaged ${f1(s.aw)}/5, compared with ${f1(s.awo)}/5 otherwise. Knowing this can help you plan extra breaks or support around them.`}));
  const hb=chosenHabits().map(h=>{const w=es.filter(e=>hdone(h,dayKey(e.date))).map(e=>e.mood),wo=es.filter(e=>!hdone(h,dayKey(e.date))).map(e=>e.mood);return {h,n:w.length,aw:avg(w),awo:avg(wo),d:(w.length>=3&&wo.length>=2)?avg(w)-avg(wo):0}}).filter(x=>x.d>=.4).sort((a,b)=>b.d-a.d)[0];
  if(hb)items.push({cls:'pos',icon:'habits',title:`Days with “${hb.h.name.toLowerCase()}” feel a bit better`,detail:`On ${hb.n} check-in days when you did this, mood averaged ${f1(hb.aw)}/5 vs ${f1(hb.awo)}/5 otherwise.`});
  const fd=new Set(state.focusLog.map(f=>dayKey(f.date)));const wf=es.filter(e=>fd.has(dayKey(e.date))).map(e=>e.mood),wof=es.filter(e=>!fd.has(dayKey(e.date))).map(e=>e.mood);
  if(wf.length>=3&&wof.length>=2&&Math.abs(avg(wf)-avg(wof))>=.5)items.push({cls:avg(wf)>avg(wof)?'pos':'',icon:'clock',title:avg(wf)>avg(wof)?'Focus days tend to feel better':'Focus days and mood',detail:`On days with a focus session, check-ins averaged ${f1(avg(wf))}/5 vs ${f1(avg(wof))}/5 on other days.`});
  const ec={};es.forEach(e=>(e.emotions||[]).forEach(x=>ec[x]=(ec[x]||0)+1));const top=Object.entries(ec).sort((a,b)=>b[1]-a[1]).slice(0,3);
  if(top.length)items.push({cls:'',icon:'mood',title:'Feelings you picked most',detail:top.map(([k,v])=>`${k} (${v})`).join(', ')+'.'});
  if(es.length>=10){const by=WD.map((_,i)=>es.filter(e=>wdIdx(e.date)===i).map(e=>e.mood));const sc=by.map((a,i)=>({i,n:a.length,a:avg(a)})).filter(x=>x.n>=2);
    if(sc.length>=3){sc.sort((a,b)=>b.a-a.a);if(sc[0].a-sc.at(-1).a>=1)items.push({cls:'',icon:'cal',title:'Your week has a shape',detail:`${WDL[sc[0].i]}s have tended to feel best (${f1(sc[0].a)}/5) and ${WDL[sc.at(-1).i]}s hardest (${f1(sc.at(-1).a)}/5).`})}}
  return {enough:true,n:es.length,items};
}

function paintChat(id){const log=$('#log-'+id);if(!log){if(view==='mood'&&id==='mood')render();return}log.innerHTML=chatLogHTML(id);log.scrollTop=log.scrollHeight;
  const s=$('#send-'+id),st=$('#stop-'+id);if(s)s.hidden=!!busyChat[id];if(st)st.hidden=!busyChat[id];
  const starters=log.parentElement.querySelector('.starters');if(starters&&state.chats[id].length)starters.remove()}
async function sendChat(id,text){
  text=text.trim();if(!text||busyChat[id])return;
  const msgs=state.chats[id];msgs.push({role:'user',content:text});
  if(CRISIS.test(text)){msgs.push({role:'safety'});save();paintChat(id);return}
  const reply={role:'assistant',content:'',pending:true,mid:uid(),demo:aiStatus!=='live'};msgs.push(reply);busyChat[id]=true;paintChat(id);
  if(aiStatus==='checking'){for(let i=0;i<20&&aiStatus==='checking';i++)await wait(250);reply.demo=aiStatus!=='live'}
  if(aiStatus==='live'){
    const turns=[{role:'user',content:CHATS[id].rules()},...msgs.filter(m=>m!==reply&&((m.role==='user')||(m.role==='assistant'&&m.content&&!m.demo))).slice(-16).map(m=>({role:m.role,content:m.content}))];
    ctlChat[id]=new AbortController();
    try{const r=await sampleFn(turns,{cache:false,modelTier:'quick',signal:ctlChat[id].signal,onText:({text})=>{reply.content=text;const b=$('#b-'+reply.mid+' .mdbody');if(b)b.innerHTML=md(text);const log=$('#log-'+id);if(log)log.scrollTop=log.scrollHeight}});
      reply.content=r.text;if(r.truncated)reply.note='This reply was cut short. Ask for a shorter version or the next part.'}
    catch(e){const res=aiFail(e);
      if(res==='switch'){reply.demo=true;reply.content=demoReply(id,text)}
      else{if(e&&e.code==='refused')reply.content='';else if(e&&e.text)reply.content=e.text;if(res)reply.note=res;if(!reply.content&&!reply.note){msgs.splice(msgs.indexOf(reply),1)}}}
  }else{await wait(700);reply.content=demoReply(id,text)}

}
function demoReply(id,text){
  const t=text.toLowerCase();
  if(id==='study'){
    if(/photosynth/.test(t))return "Let’s build it up in steps.\n\n**1. The big idea:** plants make their own food (glucose) using light energy.\n**2. What goes in:** carbon dioxide (from the air, through stomata) and water (from the roots).\n**3. Where:** in chloroplasts, where chlorophyll absorbs light.\n**4. What comes out:** glucose and oxygen.\n\nWord equation: carbon dioxide + water → glucose + oxygen (light needed).\n\n**Quick check:** why might photosynthesis slow down on a cold day, even if it’s sunny? Have a go, then I’ll give you a hint.";
    if(/quadratic/.test(t))return "Sure. First, quick question: are you comfortable factorising something like x² + 5x + 6?\n\nHere’s a practice question either way:\n\n**Solve x² − 7x + 12 = 0.**\n\nHint 1: find two numbers that multiply to 12 and add to −7.\nHint 2: write it as (x − a)(x − b) = 0.\n\nTell me what you get and I’ll check your working.";
    if(/supply|demand/.test(t))return "Let’s start with **demand**: how much people want to buy at each price. Usually, when price goes up, quantity demanded goes down.\n\n**Supply** is how much sellers want to sell at each price. When price goes up, they usually want to sell more.\n\nWhere the two curves cross is the **equilibrium**: the price where the amount people want to buy equals the amount sellers offer.\n\n**Try this:** concert tickets sell out in minutes. What does that suggest about the price compared with equilibrium?";
    return `In live mode I’d start by asking what you already know about this, then explain it in small steps with an example and finish with a practice question.\n\nFor example: *“What part of ${text.slice(0,60)} feels clearest so far, and where does it get confusing?”*`;
  }
  if(id==='task'){const name=text.replace(/[.?!].*$/,'').slice(0,50)||'Your task';const st=localBreakdown(text,'medium');
    return `That sounds like a lot to hold in your head. Let’s make it smaller.\n\nChecklist for: ${name}\n${st.map(s=>`- [ ] ${s}`).join('\n')}\n\nStart with the first step today, even if it’s only 15 minutes. When is it due, and how much time do you have each day? I can spread these out for you.`}
  return "Here’s an example of what a reflection reply looks like. Your check-ins seem brighter on days with exercise or time with friends, and tougher around tests. You could try a short walk or two minutes of box breathing on test days. That’s just an idea. You know your week best.";
}

   <div class="row"><button class="btn primary" type="submit" id="auth-submit">${mode==='signup'?'Create account':mode==='signin'?'Sign in':'Save password'}</button>
   ${mode!=='newpass'?`<button type="button" class="link" data-act="auth-open" data-mode="${mode==='signup'?'signin':'signup'}">${mode==='signup'?'I already have an account':'Create an account instead'}</button>`:''}</div>

function authErr(e){
  const m=String(e&&e.message||'');
  if(/invalid login/i.test(m))return 'That email and password don’t match. Check them and try again.';
  if(/not confirmed/i.test(m))return 'Confirm your email first. The link is in your inbox (check spam too).';
  if(/already registered|already exists/i.test(m))return 'There’s already an account with that email. Try signing in instead.';
  if(/rate limit|too many/i.test(m))return 'Too many tries in a row. Wait a few minutes, then try again.';
  if(/password/i.test(m))return 'That password isn’t accepted. Try a longer one.';
  return 'Something went wrong. Check your connection and try again.';
}
async function afterSignIn(session){
  if(!session)return;
  setSbSession(session);ACC.last={};
  let existing=false;
  try{const p=await docRef('profile').get();existing=p.exists&&p.data().storage==='account'}catch(e){}
  if(existing){
    state=await loadAccount();state.storage='account';setHint('account');try{localStorage.removeItem(KEY);localStorage.removeItem(OLDKEY)}catch(e){}
    syncState='account';timerIdle();ob=null;obStep=0;render();toast(`Welcome back${state.settings.name?', '+state.settings.name:''}. Your Bloom is loaded.`);return;
  }
  if(!state.onboarded){if(ob)ob.storage='account';render();toast('Signed in. Finish setting up and your Bloom will be saved to your account.');return}
  const ok=await moveToAccount();render();
  toast(ok?'Signed in. Your Bloom is now saved to your account.':'Signed in, but saving to your account didn’t work. Your things are still on this device.');
}
async function signOut(){
  if(state.storage==='account'&&ACC.ready){try{await accountFlushNow()}catch(e){}}

  if(state.storage==='account'){state=freshState();setHint('');try{localStorage.removeItem(KEY)}catch(e){}timerIdle();ob=null;obStep=0}
  closeDlg();render();toast('Signed out. Your Bloom is safe in your account.');
}

    state.tasks.push({id:uid(),title,subject:fd.get('subject')||'General',due:fd.get('due')||'',effort,created:new Date().toISOString(),archived:false,steps});
    save();render();toast(`Added with ${steps.length} starter steps. You can change this plan later.`);return}
  if(kind==='step'){const t=state.tasks.find(t=>t.id===f.dataset.t),v=(fd.get('text')||'').trim();if(!v)return;t.steps.push({id:uid(),text:v,done:false});save();render();$('#as-'+t.id)?.focus();return}
  if(kind==='activity'){
    const name=(fd.get('name')||'').trim();if(!name){actErr='Add a name for the activity.';render();return}
    actErr='';state.activities.push({id:uid(),name,kind:fd.get('kind')||'Other',days:fd.getAll('day').map(Number),time:fd.get('time')||'',notes:(fd.get('notes')||'').trim()});save();render();toast('Activity added to your week.');return}
  if(kind==='chat'){const ta=f.querySelector('textarea');const v=ta.value;ta.value='';sendChat(f.dataset.chat,v);return}
  if(kind==='win'){
    const text=(fd.get('text')||'').trim();if(!text){winErr='Write a few words about your win.';winCheer='';render();return}
    const k=winKind(fd.get('kind'));winErr='';winCheer=k.cheer;state.wins.push({id:uid(),date:new Date().toISOString(),kind:k.id,text});{const wn=Object.keys(state.petals.keys).filter(x=>x.startsWith('win:'+todayK())).length;if(wn<3)award('win:'+todayK()+':'+wn,3,'Little win')}save();render();setTimeout(()=>{winCheer=''},6000);return}
  if(kind==='support'){['who','where','when','how','emergency'].forEach(k=>state.support[k]=(fd.get(k)||'').trim());save();render();toast('Support contacts saved.');return}
  if(kind==='settings'){
    const s=state.settings;
    Object.assign(s,{name:(fd.get('name')||'').trim(),exam:fd.get('exam')||'',focusLen:Number(fd.get('focusLen'))||25,subjects:fd.getAll('subj'),companion:fd.get('companion')||'bud',gardenTheme:fd.get('garden')||'meadow',
      reminders:{on:!!fd.get('remOn'),time:fd.get('remTime')||'17:00',kinds:fd.getAll('remKind')},aiMood:!!fd.get('aiMood'),aiJournal:!!fd.get('aiMood')&&!!fd.get('aiJournal'),shareTasks:!!fd.get('shareTasks'),sample:false});
    state.habits.chosen=fd.getAll('hab');
    state.ui.focusLen=s.focusLen;if(T.mode==='idle')timerIdle();if(!s.aiMood){state.aiInsight=null;state.chats.mood=[]}
    const want=fd.get('set-storage')||state.storage;
    closeDlg();
    if(want!==state.storage){
      if(want==='account'){const ok=await moveToAccount();toast(ok?'Moved to your account. Open Bloom on any device to find it.':'Couldn’t reach your account, so nothing moved.')}
      else{await moveToDevice();toast('Moved to this device and removed from your account.')}
    }else save();
    render();toast(s.name?`Saved. Hi, ${s.name}!`:'Settings saved.');return}
});
$('#skip').addEventListener('click',()=>$('#main').focus());

/* ---------- AI: mood patterns & breakdown ---------- */
async function runMoodAI(){
  if(aiBusy)return;aiErr='';
  const es=state.moods.filter(e=>Date.now()-new Date(e.date)<=30*864e5);
  if(es.length<3){aiErr='Add at least 3 check-ins first so there’s something to look at.';render();return}
  aiBusy=true;render();
  if(aiStatus==='checking'){for(let i=0;i<20&&aiStatus==='checking';i++)await wait(250)}
  const local=analyze();
  if(aiStatus!=='live'){await wait(800);
    state.aiInsight={demo:true,at:Date.now(),summary:'Your check-ins look mostly “Okay” to “Good”, with a few tougher days around tests.',
      patterns:(local.items.length?local.items.slice(0,3):[{title:'Not much data yet',detail:'A few more check-ins would make patterns clearer.'}]).map(i=>({title:i.title,detail:i.detail})),
      ideas:['On test days, plan a short walk or two minutes of box breathing.','Keep using short focus blocks. They seem to suit you.'],question:'What’s one thing that made your best day this month feel good?'};
    aiBusy=false;save();render();return}
  const prompt=`You are helping a secondary-school student (about 14–18) notice gentle patterns in their own optional mood check-ins, inside a wellbeing and study app called Bloom. They chose to share this.
Rules: never diagnose, label, or assess mental health; no risk scores; no clinical terms. Patterns are correlations, not causes; use tentative language ("might", "seems", "you could notice"). Be warm, plain and brief. Suggest small, optional, practical ideas (rest, movement, water, box breathing, planning, time outside, talking to someone they trust). Don't ask them to share more personal details. If any entry suggests danger or self-harm, set "support" to true.
Mood scale: 1 Rough, 2 Low, 3 Okay, 4 Good, 5 Great.
Check-ins (oldest first):
${moodDataText(state.settings.aiJournal)}
Patterns already calculated on the device (you may build on them): ${local.items.map(i=>i.title+': '+i.detail).join(' | ')||'none'}
Reply with only JSON in this shape:
{"summary":"1–2 sentences","patterns":[{"title":"max 8 words","detail":"max 40 words"}],"ideas":["max 20 words"],"question":"one optional reflection question","support":false}
Give 2–4 patterns and 2–3 ideas.`;
  try{const r=await sampleFn.json(prompt,{modelTier:'default',cache:false});
    if(!r||typeof r!=='object'||!Array.isArray(r.patterns))throw {code:'invalid_json'};
    state.aiInsight={demo:false,at:Date.now(),summary:String(r.summary||''),patterns:r.patterns.slice(0,4).map(p=>({title:String(p.title||''),detail:String(p.detail||'')})),ideas:(Array.isArray(r.ideas)?r.ideas:[]).slice(0,3).map(String),question:String(r.question||''),support:!!r.support};
  }catch(e){const res=e&&e.code==='invalid_json'?'The AI’s answer came back in an unexpected format. Try again.':aiFail(e);
    if(res==='switch'){aiBusy=false;return runMoodAI()}aiErr=res||''}
  aiBusy=false;save();render();
}
async function aiBreakdown(id,btn){
  const t=state.tasks.find(t=>t.id===id);if(!t)return;
  if(aiStatus!=='live'){const steps=localBreakdown(t.title,t.effort);const ex=new Set(t.steps.map(s=>s.text));steps.filter(s=>!ex.has(s)).forEach(s=>t.steps.push({id:uid(),text:s,done:false}));save();render();
    toast(aiStatus==='checking'?'Still connecting to AI, so these are built-in suggestions.':'AI isn’t connected here, so these are built-in suggestions.');return}
  btn.disabled=true;btn.innerHTML=`<span class="thinking">Thinking<i></i><i></i><i></i></span>`;
  try{const r=await sampleFn.json(`A secondary-school student (IGCSE/IB) has this task: "${t.title}" (subject: ${t.subject}; ${t.due?`due ${t.due}, today is ${todayK()}`:'no due date'}; effort: ${t.effort}). Steps they already have: ${t.steps.map(s=>s.text).join('; ')||'none'}.
Suggest a realistic checklist of 3–7 small, concrete steps (each 10–40 minutes), including one short break. Keep each step under 10 words, in plain friendly language. Reply with only a JSON array of strings, e.g. ["Choose a question","Find two sources"].`,{modelTier:'quick',cache:false});
    if(!Array.isArray(r)||!r.length)throw {code:'invalid_json'};
    t.steps=[...t.steps.filter(s=>s.done),...r.slice(0,8).map(s=>({id:uid(),text:String(s).slice(0,140),done:false}))];save();render();toast('New steps suggested by AI. Edit anything that doesn’t fit.');
  }catch(e){const res=e&&e.code==='invalid_json'?'The AI’s suggestion came back in an odd format. Try again.':aiFail(e);if(res==='switch')return aiBreakdown(id,btn);render();if(res)toast(res)}
}

/* ---------- boot ---------- */
function setSbSession(s){
  ACC.kind='sb';ACC.uid=s.user.id;ACC.email=s.user.email||'';ACC.ready=true;ACC.canWrite=true;ACC.checked=true;
  if(sampleFn&&sampleFn.hosted){aiStatus='live';aiNote='';paintAIStatus()}
}
async function initAccount(){
  if(!window.claude&&SB){
    try{const {data}=await SB.auth.getSession();if(data&&data.session)setSbSession(data.session)}catch(e){}
    try{SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setTimeout(()=>openAuth('newpass'),300)})}catch(e){}
    ACC.checked=true;return;
  }
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(db&&user){const id=await user.id();if(id){ACC.db=db;ACC.user=user;ACC.uid=id;ACC.ready=true;let cw=null;try{cw=await user.can('data.write')}catch(e){}ACC.canWrite=cw!==false}}
    }
  }catch(e){}
  ACC.checked=true;
}
const raw=readLocal();
if(raw){state=normalize(raw);if(!state.onboarded&&raw.v===1)state.onboarded=true}
else{state=freshState();if(localHint()==='account')booting=true}
timerIdle();view=readHash();render();
initAI();
initAccount().then(async()=>{
  if(ACC.ready&&(!raw||state.storage==='account')){
    try{const p=await docRef('profile').get();
      if(p.exists&&p.data().storage==='account'){state=await loadAccount();state.storage='account';setHint('account');syncState='account';timerIdle()}}catch(e){}
  }
  booting=false;render();
});
setTimeout(()=>{if(booting){booting=false;render()}},12000);
})();
